# Stack pentru Dokploy: backend Medusa (imagine ghcr) + Postgres + Redis.
#
# În Dokploy:
#   1. Creezi un serviciu de tip "Compose" legat de acest repo (sau lipești acest fișier).
#   2. Pui variabilele din `dokploy.env.example` în tab-ul "Environment".
#   3. Deploy. La pornire rulează automat migrațiile (vezi docker-entrypoint.sh).
#   4. În tab-ul "Domains" adaugi domeniul → service `backend`, port `9000`.
#
# Postgres și Redis NU sunt expuse în afară — comunică intern prin rețeaua `default`.
# Doar `backend` e pe `dokploy-network` ca să-l poată rula Traefik.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medusa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-onlybestdevice}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medusa} -d ${POSTGRES_DB:-onlybestdevice}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/danovici03/site.onlybestdevice-backend:latest
    # Dokploy deployează cu `docker compose up -d`, fără `--pull`. Fără linia de
    # mai jos, Docker vede că are deja local tag-ul `:latest`, nu mai întreabă
    # registry-ul și lasă containerul vechi în picioare — deploy-ul iese verde
    # dar rulează codul precedent. `always` îl obligă să verifice ghcr de
    # fiecare dată (dacă digest-ul e același, nu descarcă nimic).
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # ── Construit din POSTGRES_* de mai sus (nu-l setezi manual) ──
      # sslmode=disable: Postgres din stack nu suportă SSL, iar Medusa forțează
      # SSL în producție dacă URL-ul nu conține localhost/127.0.0.1/sslmode=disable
      # (vezi @medusajs/utils load-module-database-config getDefaultDriverOptions).
      DATABASE_URL: postgres://${POSTGRES_USER:-medusa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-onlybestdevice}?sslmode=disable
      REDIS_URL: redis://redis:6379

      # ── Obligatorii (setate în Dokploy → Environment) ──
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET}
      STORE_CORS: ${STORE_CORS:?set STORE_CORS}
      ADMIN_CORS: ${ADMIN_CORS:?set ADMIN_CORS}
      AUTH_CORS: ${AUTH_CORS:?set AUTH_CORS}
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:?set MEDUSA_BACKEND_URL}

      # ── ERP (gestiunea Laravel) ──
      # Goale = subscriberul `erp-order-sync` se autodezactivează și comenzile NU
      # ajung în gestiune. Fără liniile astea, ce setezi în Dokploy rămâne în
      # .env-ul de lângă compose și nu intră niciodată în container: compose
      # pasează doar ce e enumerat aici.
      # ERP_WEBHOOK_SECRET trebuie să fie identic cu MEDUSA_WEBHOOK_SECRET din
      # env-ul gestiunii.
      ERP_WEBHOOK_URL: ${ERP_WEBHOOK_URL:-}
      ERP_WEBHOOK_SECRET: ${ERP_WEBHOOK_SECRET:-}
      ERP_STOCK_LOCATION_ID: ${ERP_STOCK_LOCATION_ID:-}

      # ── Migrații + admin bootstrap (entrypoint) ──
      RUN_MIGRATIONS: "true"
      CREATE_ADMIN_EMAIL: ${CREATE_ADMIN_EMAIL:-}
      CREATE_ADMIN_PASSWORD: ${CREATE_ADMIN_PASSWORD:-}

      # ── Object storage S3 (Hetzner/R2/AWS) — gol = fișiere locale în volume ──
      S3_FILE_URL: ${S3_FILE_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}

      # ── Stripe (opțional) ──
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

      # ── URL-ul public al storefront-ului (redirect-uri după plată) ──
      STOREFRONT_URL: ${STOREFRONT_URL:-}

      # ── Invalidarea cache-ului Next.js după modificări în Admin ──
      #    Storefront-ul cere produsele cu `force-cache` și fără TTL, deci un
      #    produs nou sau un preț schimbat NU apare pe site până când
      #    subscriberul `revalidate-storefront` lovește ruta de mai jos.
      #    Goale = subscriberul se autodezactivează și site-ul rămâne cu datele
      #    vechi până la următorul deploy de storefront.
      STOREFRONT_REVALIDATE_URL: ${STOREFRONT_REVALIDATE_URL:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}

      # ── Legarea automată a variantelor de culoare la telefoane ──
      #    `0` oprește subscriberul `phone-group-link`. Fără linia asta,
      #    variabila setată în Dokploy rămâne în .env-ul de lângă compose și nu
      #    intră niciodată în container — adică frâna de mână n-ar exista.
      PHONE_GROUP_AUTOLINK: ${PHONE_GROUP_AUTOLINK:-}

      # ── UniCredit ePOS (rate) — gol = provider dezactivat ──
      UNICREDIT_EPOS_BASE_URL: ${UNICREDIT_EPOS_BASE_URL:-}
      UNICREDIT_EPOS_EMAIL: ${UNICREDIT_EPOS_EMAIL:-}
      UNICREDIT_EPOS_PASSWORD: ${UNICREDIT_EPOS_PASSWORD:-}
      UNICREDIT_CALLBACK_TOKEN: ${UNICREDIT_CALLBACK_TOKEN:-}

      # ── Netopia mobilPay (card) — gol = provider dezactivat.
      #    Cheile se montează pe server în /opt/onlybestdevice/keys (vezi volumes).
      NETOPIA_ENV: ${NETOPIA_ENV:-}
      NETOPIA_API_KEY: ${NETOPIA_API_KEY:-}
      NETOPIA_POS_SIGNATURE: ${NETOPIA_POS_SIGNATURE:-}
      NETOPIA_PUBLIC_CER_PATH: ${NETOPIA_PUBLIC_CER_PATH:-}
      NETOPIA_PRIVATE_KEY_PATH: ${NETOPIA_PRIVATE_KEY_PATH:-}

      # ── TBI Bank (rate) — gol = provider dezactivat ──
      TBI_ENV: ${TBI_ENV:-}
      TBI_STORE_ID: ${TBI_STORE_ID:-}
      TBI_USERNAME: ${TBI_USERNAME:-}
      TBI_PASSWORD: ${TBI_PASSWORD:-}
      TBI_PUBLIC_KEY_PATH: ${TBI_PUBLIC_KEY_PATH:-}
      TBI_PRIVATE_KEY_PATH: ${TBI_PRIVATE_KEY_PATH:-}
      TBI_PRIVATE_KEY_PASSPHRASE: ${TBI_PRIVATE_KEY_PASSPHRASE:-}
      TBI_CALLBACK_TOKEN: ${TBI_CALLBACK_TOKEN:-}

      # ── Resend email (opțional) ──
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
      # Destinatarul notificărilor de comandă nouă / retur pentru magazin.
      ADMIN_ORDER_NOTIFICATION_EMAIL: ${ADMIN_ORDER_NOTIFICATION_EMAIL:-}

      # ── Contul bancar din emailul de virament ──
      #    Fără BANK_IBAN, `POST /admin/orders/:id/status` refuză să trimită
      #    emailul „În așteptarea viramentului" — operatorul vede în admin
      #    „contul bancar nu e configurat". Atenție: a-l pune în Dokploy →
      #    Environment NU e de ajuns, variabila trebuie enumerată și aici.
      BANK_IBAN: ${BANK_IBAN:-}
      BANK_NAME: ${BANK_NAME:-}
      BANK_HOLDER: ${BANK_HOLDER:-}
    volumes:
      # Doar dacă NU folosești S3 — păstrează fișierele urcate la restart.
      - backend_static:/app/static
      # Cheile de plată (Netopia .cer/.key, TBI) — copiate manual pe server
      # prin SSH; NU sunt în imagine și NU se comit în git.
      - /opt/onlybestdevice/keys:/app/keys:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - default
      - dokploy-network

volumes:
  pgdata:
  redisdata:
  backend_static:

networks:
  # Rețea internă implicită pentru backend ↔ postgres ↔ redis.
  default:
  # Rețeaua Traefik a Dokploy (creată automat de Dokploy).
  dokploy-network:
    external: true
